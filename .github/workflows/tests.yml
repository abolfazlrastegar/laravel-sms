name: Tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "^8.0"
            php: "7.4"
            testbench: "^6.0"
            phpunit: "^9.5"
          - laravel: "^9.0"
            php: "8.1"
            testbench: "^7.0"
            phpunit: "^9.5"
          - laravel: "^10.0"
            php: "8.1"
            testbench: "^8.0"
            phpunit: "^10.0"
          - laravel: "^11.0"
            php: "8.2"
            testbench: "^9.0"
            phpunit: "^10.0"
          - laravel: "^12.0"
            php: "8.2"
            testbench: "^10.0"
            phpunit: "^11.0"
          - laravel: "^13.0"
            php: "8.3"
            testbench: "^11.0"
            phpunit: "^12.0"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer validate --strict

      - name: Select Laravel and test dependencies
        run: >
          composer require --no-update --no-interaction
          "illuminate/http:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"
          "illuminate/bus:${{ matrix.laravel }}"
          "illuminate/contracts:${{ matrix.laravel }}"
          "illuminate/queue:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"

      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/phpunit
